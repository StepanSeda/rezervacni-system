{% extends "base.html" %}
{% block content %}
<section class="section">
  <h2>Správa termínů</h2>
  <form method="post" class="form inline">
    <select name="class_id">{% for c in classes %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select>
    <input name="trainer" placeholder="Trenér" required>
    <input type="datetime-local" name="starts_at" required>
    <input type="number" name="capacity" value="12" min="1" required>
    <button class="btn btn-small">Přidat termín</button>
  </form>
  <div class="table-wrap"><table>
    <thead><tr><th>Termín</th><th>Lekce</th><th>Trenér</th><th>Kapacita</th><th>Přihlášení</th><th></th></tr></thead>
    <tbody>{% for r in rows %}
      <tr><td>{{ r.starts_at | fmt }}</td><td>{{ r.cname }}</td><td>{{ r.trainer }}</td><td>{{ r.capacity }}</td>
        <td>{{ r.people or '–' }}</td>
        <td><form method="post" action="{{ url_for('admin_delete', sid=r.id) }}"><button class="btn btn-small btn-ghost">Smazat</button></form></td></tr>
    {% endfor %}</tbody></table></div>
</section>
{% endblock %}
