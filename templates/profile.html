{% extends "base.html" %}
{% block content %}
<section class="section narrow">
  <h2>Můj profil</h2>
  <form method="post" class="form"><input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>Jméno<input name="name" value="{{ user.name }}" required></label>
    <label>E-mail<input value="{{ user.email }}" disabled></label>
    <label>Staré heslo (jen při změně)<input type="password" name="old"></label>
    <label>Nové heslo<input type="password" name="new" minlength="6"></label>
    <button class="btn">Uložit</button>
  </form>
</section>
{% endblock %}
