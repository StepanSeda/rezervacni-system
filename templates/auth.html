{% extends "base.html" %}
{% block content %}
<section class="section narrow">
  <h2>{{ 'Registrace' if register else 'Přihlášení' }}</h2>
  <form method="post" class="form">
    {% if register %}<label>Jméno<input name="name" required></label>{% endif %}
    <label>E-mail<input type="email" name="email" required></label>
    <label>Heslo<input type="password" name="password" required minlength="6"></label>
    <button class="btn">{{ 'Vytvořit účet' if register else 'Přihlásit se' }}</button>
  </form>
  <p class="muted">{% if register %}Máš účet? <a href="{{ url_for('login') }}">Přihlas se</a>
    {% else %}Nemáš účet? <a href="{{ url_for('register') }}">Zaregistruj se</a>{% endif %}</p>
</section>
{% endblock %}
