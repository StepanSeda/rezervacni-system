{% extends "base.html" %}
{% block content %}
<section class="section narrow"><h2>{{ e.code }}</h2>
  <p class="muted">{{ 'Stránka nenalezena.' if e.code == 404 else 'Přístup odepřen.' if e.code == 403 else 'Neplatný požadavek, zkus to znovu.' }}</p>
  <p><a href="{{ url_for('index') }}">Zpět na úvod</a></p></section>
{% endblock %}
